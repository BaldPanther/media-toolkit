<!-- Вкладка «Дорожки и субтитры». -->
<div x-data="tracksTab" class="stack">
  <div class="tracks-top">
    <section class="card">
      <div class="card-head"><h2>Что поставить по умолчанию</h2></div>
      <div class="tracks-choice">
        <div class="field">
          <label for="t-audio">Аудио</label>
          <select id="t-audio" class="input" :disabled="$store.app.busy || !t.audio_options"
                  :value="t.audio_choice" @change="choose($event.target.value, t.sub_choice)">
            <option value="">— не трогать —</option>
            <template x-for="o in t.audio_options || []" :key="o.id">
              <option :value="o.id" x-text="o.label" :selected="o.id === t.audio_choice"></option>
            </template>
          </select>
        </div>
        <div class="field">
          <label for="t-sub">Субтитры</label>
          <select id="t-sub" class="input" :disabled="$store.app.busy || !t.sub_options"
                  :value="t.sub_choice" @change="choose(t.audio_choice, $event.target.value)">
            <option value="">— не трогать —</option>
            <option value="off" :selected="t.sub_choice === 'off'">— выключить субтитры —</option>
            <template x-for="o in t.sub_options || []" :key="o.id">
              <option :value="o.id" x-text="o.label" :selected="o.id === t.sub_choice"></option>
            </template>
          </select>
        </div>
      </div>
      <div class="card-foot">
        <button type="button" class="btn btn-primary" @click="apply()"
                :disabled="$store.app.busy || !hasFiles() || (!t.audio_choice && !t.sub_choice)">
          <svg class="icon"><use href="#i-check"/></svg>Применить (дорожки/субтитры)
        </button>
        <span class="small muted" x-show="hasFiles()">
          К изменению: <b class="accent-text" x-text="t.n_change"></b>,
          предупреждений: <b :class="t.n_warn ? 'warn-text' : ''" x-text="t.n_warn"></b>
        </span>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Русские субтитры</h2><span class="sub">качаются файлом .ru.srt рядом с серией</span>
      </div>
      <label class="check" :class="{ disabled: $store.app.busy }">
        <input type="checkbox" :checked="t.subs_only_missing" :disabled="$store.app.busy"
               @change="t.subs_only_missing = $event.target.checked">
        только где русских ещё нет
      </label>
      <div class="card-foot">
        <button type="button" class="btn" @click="downloadSubs()" :disabled="$store.app.busy || !hasFiles()">
          <svg class="icon"><use href="#i-subtitles"/></svg>Скачать русские субтитры
        </button>
        <button type="button" class="btn btn-ghost" @click="$dispatch('open-settings', { section: 'subs' })">
          OpenSubtitles…
        </button>
      </div>
      <p class="small muted" style="margin-top: 10px" x-show="t.subs_status" x-text="t.subs_status"></p>
    </section>
  </div>

  <section class="card">
    <div class="card-head">
      <h2>Файлы</h2>
      <span class="sub" x-show="hasFiles()" x-text="(t.rows || []).length + ' ' + fmt.plural((t.rows || []).length, 'файл', 'файла', 'файлов')"></span>
    </div>
    <div class="empty" x-show="!hasFiles()">
      <svg class="icon"><use href="#i-film"/></svg>
      <div>Выберите папку сериала или фильма и нажмите «Сканировать» — здесь появятся его MKV
        и что в них поменяется.</div>
    </div>
    <div class="table-wrap" x-show="hasFiles()">
      <table class="table">
        <thead>
          <tr>
            <th>Файл</th><th>Аудио сейчас</th><th>→ Новая аудио</th>
            <th>Субтитры сейчас</th><th>→ Новые субтитры</th><th>Статус</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="r in t.rows || []" :key="r.path">
            <tr :class="{ dim: r.kind === 'nochange' }">
              <td class="file" x-text="r.file" :title="r.path"></td>
              <td x-text="r.acur"></td>
              <td :class="{ 'accent-text': r.kind === 'change' }" x-text="r.anew"></td>
              <td x-text="r.scur"></td>
              <td :class="{ 'accent-text': r.kind === 'change' }" x-text="r.snew"></td>
              <td><span class="badge" :class="badge(r.kind)" x-text="r.status"></span></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </section>
</div>
